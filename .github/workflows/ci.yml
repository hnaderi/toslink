name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build/host
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the runner has several versions, and their output differs. Keep in sync with flake.nix.
      - name: clang-format
        run: git ls-files -- '*.c' '*.h' | xargs clang-format-18 --dry-run --Werror

  build-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v6.0, v6.1]
        target: [esp32, esp32s2, esp32s3, esp32c3]
        config: [tx, rx_max_payload, tx_soak]
    steps:
      # IDF names components after their directory, so it must match the component name.
      - uses: actions/checkout@v4
        with:
          path: toslink
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: toslink/examples/link_test
          command: idf.py -D SDKCONFIG_DEFAULTS=../../.github/ci/${{ matrix.config }}.defaults build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and archive
        run: |
          pip install idf-component-manager
          compote component pack --name toslink
